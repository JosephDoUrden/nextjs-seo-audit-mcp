name: Release Please

# Runs only after CI has passed on main, or by hand. There is no push trigger, so a push
# cannot cut a release before its CI run has finished.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# One release run at a time; a second waits instead of racing the first to npm.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      )
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A personal token makes CI start on the release PR by itself. Without one the
          # workflow token is used and CI is run on that branch by hand (see ci.yml).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Unprivileged: builds, tests and packs the tarball the publish job uploads. The npm cache
  # lives here, never in the job that holds the OIDC token.
  build:
    needs: release-please
    # Runs after a release, or by hand when a release exists but a publish step failed.
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
      - name: Pack
        run: |
          mkdir release
          npm pack --pack-destination release
          cp server.json release/
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Protected environment: set required reviewers and the main-only branch rule on it in the
    # repo settings, and name it in the npm trusted publisher config.
    environment: npm
    permissions:
      id-token: write
    env:
      # Pinned and verified below, as the registry's GitHub Actions guide shows
      # (github.com/modelcontextprotocol/registry, docs/modelcontextprotocol-io/github-actions.mdx,
      # read 31 Oct 2026). Bump deliberately; never switch to releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # No cache here: this job holds the OIDC token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10. Exact pin,
      # checked with `npm view npm@11 version` on 31 Oct 2026.
      - run: npm install -g npm@11.21.1
      - run: npm --version
      # No token: npm authenticates the job through GitHub's OIDC token (trusted publisher set on
      # npmjs.com for this repo, workflow file and environment). Provenance is attached automatically.
      - name: Publish to npm
        working-directory: release
        run: |
          set -euo pipefail
          tarball=$(ls nextjs-seo-audit-mcp-*.tgz)
          VERSION=$(node -p "require('./server.json').version")
          if npm view "nextjs-seo-audit-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "::warning::v${VERSION} already published, skipping."
          else
            npm publish "./${tarball}" --provenance --access public
          fi

      # The registry checks that the npm package's mcpName matches server.json's name, so this
      # runs after the npm publish.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        working-directory: release
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to the MCP Registry
        working-directory: release
        run: ./mcp-publisher login github-oidc
      # The registry checks npm for the exact version; a fresh publish can take a minute to show.
      - name: Wait for the version to appear on npm
        working-directory: release
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            if npm view "nextjs-seo-audit-mcp@${version}" version >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "::error::nextjs-seo-audit-mcp@${version} not visible on npm after 5 minutes"; exit 1
      - name: Publish to the MCP Registry
        working-directory: release
        run: ./mcp-publisher publish
